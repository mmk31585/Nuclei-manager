basePath: /api/v1
consumes:
- application/json
definitions:
  github_com_mmk31585_Nuclei-manager_internal_domain.Profile:
    properties:
      builtin:
        description: True for seeded built-in profiles (read-only, defaults to false)
        type: boolean
      bulk_size:
        description: Bulk size (1-500, defaults to 25)
        type: integer
      concurrency:
        description: Concurrent requests (1-500, defaults to 25)
        type: integer
      created_at:
        description: Creation timestamp (read-only)
        type: string
      custom_set:
        description: Name of an external custom template set directory
        type: string
      description:
        description: Optional free-text description
        type: string
      exclude_tags:
        description: Exclude templates carrying any of these tags
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      id:
        description: Profile identifier (read-only)
        type: integer
      max_duration_min:
        description: Max total scan duration in minutes (1-1440, defaults to 120)
        type: integer
      max_host_error:
        description: Max errors per host before skipping it (1-1000, defaults to 30)
        type: integer
      name:
        description: Unique profile name (1-191 characters)
        type: string
      oast:
        description: Enable OAST interaction callbacks
        type: boolean
      protocols:
        description: Restrict to these protocols (http, dns, tcp, ssl, websocket,
          whois, javascript, workflow)
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      rate_limit:
        description: Requests per second (1-10000, defaults to 50)
        type: integer
      retries:
        description: Retries per request (0-10, defaults to 1)
        type: integer
      severity:
        description: Only run templates of these severities
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      tags:
        description: Only run templates with at least one of these tags
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      template_ids:
        description: Restrict to these exact template IDs
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      timeout_sec:
        description: Per-request timeout in seconds (1-300, defaults to 10)
        type: integer
      updated_at:
        description: Last update timestamp (read-only)
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.Run:
    properties:
      command_line:
        description: Full nuclei command line that was executed
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      error_message:
        description: Error message when the run failed
        type: string
      exit_code:
        description: Nuclei process exit code (null if not run)
        type: integer
      findings_critical:
        description: Critical findings
        type: integer
      findings_high:
        description: High findings
        type: integer
      findings_info:
        description: Info findings plus unknown severities
        type: integer
      findings_low:
        description: Low findings
        type: integer
      findings_medium:
        description: Medium findings
        type: integer
      finished_at:
        description: Finish time (null until terminal)
        type: string
      id:
        description: Run identifier (read-only)
        type: integer
      log_path:
        description: Path to the captured log file
        type: string
      nuclei_version:
        description: Detected nuclei engine version
        type: string
      parse_errors:
        description: Lines that failed to parse
        type: integer
      raw_output_path:
        description: Path to the raw nuclei output file
        type: string
      requests_count:
        description: Number of requests issued (not populated yet)
        type: integer
      results_total:
        description: Total findings reported
        type: integer
      started_at:
        description: Start time (null until claimed)
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.RunStatus'
        description: Current lifecycle status (see RunStatus)
      targets_count:
        description: Number of targets in the run
        type: integer
      task_id:
        description: Identifier of the task that produced this run
        type: integer
      templates_version:
        description: Detected nuclei templates version
        type: string
      trigger:
        description: 'How the run was started: manual or schedule'
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.RunStatus:
    enum:
    - queued
    - running
    - processing
    - completed
    - failed
    - timed_out
    - stopped
    - cancelled
    type: string
    x-enum-varnames:
    - RunQueued
    - RunRunning
    - RunProcessing
    - RunCompleted
    - RunFailed
    - RunTimedOut
    - RunStopped
    - RunCancelled
  github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType:
    enum:
    - once
    - cron
    type: string
    x-enum-varnames:
    - ScheduleOnce
    - ScheduleCron
  github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry:
    properties:
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      id:
        description: Scope entry identifier (read-only)
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind'
        description: 'Entry type: domain, cidr or ip'
      value:
        description: Entry value, normalized on write (domain lowercased, CIDR/IP
          canonicalized)
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind:
    enum:
    - domain
    - cidr
    - ip
    type: string
    x-enum-varnames:
    - ScopeDomain
    - ScopeCIDR
    - ScopeIP
  github_com_mmk31585_Nuclei-manager_internal_domain.Severity:
    enum:
    - info
    - low
    - medium
    - high
    - critical
    type: string
    x-enum-varnames:
    - SeverityInfo
    - SeverityLow
    - SeverityMedium
    - SeverityHigh
    - SeverityCritical
  github_com_mmk31585_Nuclei-manager_internal_domain.Target:
    properties:
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      exclude:
        description: Hosts, IPs or CIDRs excluded from the scan
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      hosts:
        description: Hosts to scan (URLs, host:port, bare hosts or IPs); at least
          one required
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      id:
        description: Target identifier (read-only, assigned by the server)
        type: integer
      name:
        description: Unique target name (1-191 characters)
        type: string
      probe_first:
        description: Probe hosts for reachability before scanning (defaults to true)
        type: boolean
      tags:
        description: Arbitrary labels for filtering and grouping
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      updated_at:
        description: Last update timestamp (read-only)
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.Task:
    properties:
      add_to_assets:
        description: Add discovered hosts to the asset inventory
        type: boolean
      apply_suppressions:
        description: Apply configured suppressions to findings
        type: boolean
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      cron_expr:
        description: Cron expression, required when schedule_type is cron
        type: string
      enabled:
        description: Whether the schedule is enabled
        type: boolean
      id:
        description: Task identifier (read-only)
        type: integer
      min_severity:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Severity'
        description: Minimum severity reported by this task (defaults to medium)
      name:
        description: Unique task name (1-191 characters)
        type: string
      notify_on:
        description: Severities that trigger a notification
        items:
          enum:
          - info
          - low
          - medium
          - high
          - critical
          type: string
        type: array
      profile_id:
        description: Identifier of the profile to use (must exist)
        type: integer
      retention_keep_last:
        description: Number of most recent runs to retain (1-1000, defaults to 20)
        type: integer
      schedule_type:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType'
        description: 'Schedule type: once or cron (defaults to once)'
      target_id:
        description: Identifier of the target to scan (must exist)
        type: integer
      timezone:
        description: IANA timezone for the schedule (defaults to UTC)
        type: string
      updated_at:
        description: Last update timestamp (read-only)
        type: string
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        description: Human-readable error message
        example: 'validation failed: name is required'
        type: string
    type: object
  internal_api.LogChunk:
    properties:
      data:
        description: Decoded text chunk (invalid bytes replaced)
        type: string
      eof:
        description: True when there is no more data after this chunk
        type: boolean
      next_offset:
        description: Offset to pass as the next page's offset when tailing
        type: integer
      offset:
        description: Byte offset this chunk starts at
        type: integer
    type: object
  internal_api.profileRequest:
    properties:
      bulk_size:
        description: Bulk size (1-500)
        example: 25
        type: integer
      concurrency:
        description: Concurrent requests (1-500)
        example: 25
        type: integer
      custom_set:
        description: Name of an external custom template set directory
        example: custom-a
        type: string
      description:
        description: Optional description
        example: External-facing web checks
        type: string
      exclude_tags:
        description: Exclude templates carrying any of these tags
        example:
        - dos
        - intrusive
        items:
          type: string
        type: array
      max_duration_min:
        description: Max total scan duration in minutes (1-1440)
        example: 120
        type: integer
      max_host_error:
        description: Max errors per host before skipping it (1-1000)
        example: 30
        type: integer
      name:
        description: Unique profile name
        example: external-only
        type: string
      oast:
        description: Enable OAST interaction callbacks
        type: boolean
      protocols:
        description: Restrict to these protocols (http, dns, tcp, ssl, websocket,
          whois, javascript, workflow)
        example:
        - http
        - ssl
        items:
          type: string
        type: array
      rate_limit:
        description: Requests per second (1-10000)
        example: 50
        type: integer
      retries:
        description: Retries per request (0-10)
        example: 1
        type: integer
      severity:
        description: Only run templates of these severities
        example:
        - medium
        - high
        - critical
        items:
          type: string
        type: array
      tags:
        description: Only run templates with at least one of these tags
        example:
        - cve
        - exposure
        items:
          type: string
        type: array
      template_ids:
        description: Restrict to these exact template IDs
        example:
        - cve-2021-0001
        items:
          type: string
        type: array
      timeout_sec:
        description: Per-request timeout in seconds (1-300)
        example: 10
        type: integer
    type: object
  internal_api.scopeRequest:
    properties:
      comment:
        description: Optional comment
        example: Corporate domain
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind'
        description: 'Entry type: domain, cidr or ip'
        example: domain
      value:
        description: Entry value; normalized on write (domain lowercased, CIDR/IP
          canonicalized)
        example: example.com
        type: string
    type: object
  internal_api.targetRequest:
    properties:
      comment:
        description: Optional comment
        example: Public staging estate
        type: string
      exclude:
        description: Hosts, IPs or CIDRs excluded from the scan
        example:
        - 10.0.0.0/8
        items:
          type: string
        type: array
      hosts:
        description: Hosts to scan (URLs, host:port, bare hosts or IPs); at least
          one required
        example:
        - https://app.example.com
        items:
          type: string
        type: array
      name:
        description: Unique target name
        example: staging-web
        type: string
      probe_first:
        description: Probe hosts before scanning; defaults to true when omitted
        type: boolean
      tags:
        description: Arbitrary labels
        example:
        - prod
        items:
          type: string
        type: array
    type: object
  internal_api.taskRequest:
    properties:
      add_to_assets:
        description: Add discovered hosts to the asset inventory
        type: boolean
      apply_suppressions:
        description: Apply configured suppressions to findings
        type: boolean
      comment:
        description: Optional comment
        example: Nightly staging scan
        type: string
      cron_expr:
        description: Cron expression, required when schedule_type is cron
        example: 0 2 * * *
        type: string
      enabled:
        description: Whether the schedule is enabled
        type: boolean
      min_severity:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Severity'
        description: Minimum severity reported
        example: medium
      name:
        description: Unique task name
        example: nightly-staging
        type: string
      notify_on:
        description: Severities that trigger a notification
        example:
        - high
        - critical
        items:
          type: string
        type: array
      profile_id:
        description: Profile to use (must exist)
        example: 1
        type: integer
      retention_keep_last:
        description: Number of most recent runs to retain (1-1000)
        example: 20
        type: integer
      schedule_type:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType'
        description: 'Schedule type: once or cron'
        example: cron
      target_id:
        description: Target to scan (must exist)
        example: 1
        type: integer
      timezone:
        description: IANA timezone for the schedule
        example: UTC
        type: string
    type: object
host: localhost
info:
  contact:
    name: scanner-manager
    url: https://github.com/mmk31585/Nuclei-manager
  description: |-
    REST API for managing Nuclei vulnerability scans.
    The service validates every target against a configurable scope allowlist,
    exposes scan profiles (built-in and custom), and stores tasks that bind a
    target to a profile. It is the control plane for a planned worker that
    executes Nuclei and stores runs and findings.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: scanner-manager API
  version: "0.1"
paths:
  /profiles:
    get:
      description: Returns all scan profiles ordered by id, including the seeded built-in
        profiles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List profiles
      tags:
      - profiles
    post:
      consumes:
      - application/json
      description: Creates a custom profile. Zero-valued numeric fields are filled
        with defaults before validation.
      parameters:
      - description: Profile to create
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/internal_api.profileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a profile
      tags:
      - profiles
  /profiles/{id}:
    delete:
      description: Deletes a custom profile by id. Built-in profiles and profiles
        referenced by tasks return 409.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Built-in profile or profile in use
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Delete a profile
      tags:
      - profiles
    get:
      description: Returns a single profile by id.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a profile
      tags:
      - profiles
    put:
      consumes:
      - application/json
      description: Full replacement of a custom profile by id. Built-in profiles are
        read-only and return 409.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      - description: Replacement profile
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/internal_api.profileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Built-in profiles are read-only
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Replace a profile
      tags:
      - profiles
  /runs:
    get:
      description: Returns runs ordered by id (newest first). Optionally filter by
        task_id and/or status.
      parameters:
      - description: Filter by task ID
        in: query
        name: task_id
        type: integer
      - description: Filter by status
        enum:
        - queued
        - running
        - processing
        - completed
        - failed
        - timed_out
        - stopped
        - cancelled
        in: query
        name: status
        type: string
      - description: Maximum results (1-200, default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List runs
      tags:
      - runs
  /runs/{id}:
    get:
      description: Returns a single run by id, including timing and finding counters.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a run
      tags:
      - runs
  /runs/{id}/log:
    get:
      description: Returns a UTF-8 page of the run's supervisor log starting at a
        byte offset. Pass next_offset back to tail.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Byte offset to start from (default 0)
        in: query
        name: offset
        type: integer
      - description: Maximum bytes to return (default 65536, max 1048576)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.LogChunk'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Read run log
      tags:
      - runs
  /runs/{id}/output:
    get:
      description: Downloads the raw Nuclei JSONL results for a run as application/x-ndjson.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/x-ndjson
      responses:
        "200":
          description: Newline-delimited JSON results
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: No output yet
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Download raw run output
      tags:
      - runs
  /runs/{id}/stop:
    post:
      description: Cancels a queued run, or asks the worker to stop a running run.
        Stopping a running run is asynchronous.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Run cancelled while still queued
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
        "202":
          description: Stop requested for a running run
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Run already finished or is not active on this instance
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Stop a run
      tags:
      - runs
  /scope:
    get:
      description: Returns all scope allowlist entries ordered by id. An empty allowlist
        makes the target check fail-closed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List scope entries
      tags:
      - scope
    post:
      consumes:
      - application/json
      description: Adds a domain, CIDR or IP to the allowlist. Values are normalized
        and validated.
      parameters:
      - description: Scope entry to create
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/internal_api.scopeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a scope entry
      tags:
      - scope
  /scope/{id}:
    delete:
      description: Removes a scope entry by id.
      parameters:
      - description: Scope entry ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
