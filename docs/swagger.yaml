basePath: /api/v1
consumes:
- application/json
definitions:
  github_com_mmk31585_Nuclei-manager_internal_domain.Profile:
    properties:
      authors:
        description: Only run templates by these authors
        items:
          type: string
        type: array
      basic_auth:
        description: Basic auth username:password for authenticated scans
        type: string
      builtin:
        description: True for seeded built-in profiles (read-only, defaults to false)
        type: boolean
      bulk_size:
        description: Bulk size (1-500, defaults to 25)
        type: integer
      concurrency:
        description: Concurrent requests (1-500, defaults to 25)
        type: integer
      cookies:
        description: Cookies sent with every request
        items:
          type: string
        type: array
      created_at:
        description: Creation timestamp (read-only)
        type: string
      custom_headers:
        description: Custom headers passed with every request
        items:
          type: string
        type: array
      custom_set:
        description: Name of an external custom template set directory
        type: string
      description:
        description: Optional free-text description
        type: string
      exclude_protocols:
        description: Exclude these protocol types
        items:
          type: string
        type: array
      exclude_severity:
        description: Exclude templates of these severities
        items:
          type: string
        type: array
      exclude_tags:
        description: Exclude templates carrying any of these tags
        items:
          type: string
        type: array
      exclude_template_ids:
        description: Exclude these exact template IDs
        items:
          type: string
        type: array
      exclude_templates:
        description: ExcludeTemplates path to template file or directory to exclude.
        items:
          type: string
        type: array
      follow_redirects:
        description: Follow HTTP redirects for HTTP templates
        type: boolean
      headless:
        description: Headless
        type: boolean
      headless_bulk_size:
        type: integer
      headless_concurrency:
        type: integer
      headless_options:
        items:
          type: string
        type: array
      id:
        description: Profile identifier (read-only)
        type: integer
      include_tags:
        description: Include tags even if excluded by default/configuration
        items:
          type: string
        type: array
      include_templates:
        description: |-
          Template filters
          IncludeTemplates path to template file or directory to be executed even if excluded.
        items:
          type: string
        type: array
      input_mode:
        description: 'Input format: "list" (default), "burp", "jsonl", "yaml", "openapi",
          "swagger"'
        type: string
      interactions_cache_size:
        type: integer
      interactions_cooldown_period:
        type: integer
      interactions_eviction:
        type: integer
      interactions_poll_duration:
        type: integer
      interactsh_server:
        description: Interactsh/OAST
        type: string
      interactsh_token:
        type: string
      ip_version:
        description: IPVersion to scan (4, 6).
        items:
          type: string
        type: array
      js_concurrency:
        type: integer
      json_export:
        description: JSONExport file to export results in JSON format.
        type: string
      jsonl_export:
        description: JSONLExport file to export results in JSONL format.
        type: string
      leave_default_ports:
        type: boolean
      list_headless_actions:
        type: boolean
      markdown_export:
        description: MarkdownExport directory to export results in markdown format.
        type: string
      matcher_status:
        description: MatcherStatus displays match failure status.
        type: boolean
      max_duration_min:
        description: Max total scan duration in minutes (1-1440, defaults to 120)
        type: integer
      max_host_error:
        description: Max errors per host before skipping it (1-1000, defaults to 30)
        type: integer
      max_redirects:
        description: Max number of redirects to follow (default 10)
        type: integer
      name:
        description: Unique profile name (1-191 characters)
        type: string
      no_httpx:
        description: Disable httpx probing for non-URL input
        type: boolean
      no_meta:
        description: NoMeta disables printing result metadata in CLI output.
        type: boolean
      no_mhe:
        type: boolean
      oast:
        description: Enable OAST interaction callbacks
        type: boolean
      omit_raw:
        description: OmitRaw omits request/response pairs in JSON/JSONL/Markdown outputs.
        type: boolean
      omit_template:
        description: OmitTemplate omits encoded template in JSON/JSONL output.
        type: boolean
      output_format:
        description: 'Output format: jsonl (default), json, sarif'
        type: string
      page_timeout:
        type: integer
      payload_concurrency:
        type: integer
      prefetch_secrets:
        description: PrefetchSecrets prefetches secrets from the secrets file.
        type: boolean
      probe_concurrency:
        type: integer
      project:
        type: boolean
      project_path:
        type: string
      protocols:
        description: Restrict to these protocols (http, dns, tcp, ssl, websocket,
          whois, javascript, workflow)
        items:
          type: string
        type: array
      rate_limit:
        description: Requests per second (1-10000, defaults to 50)
        type: integer
      rate_limit_duration:
        type: string
      rate_limit_minute:
        description: Rate Limiting / Performance
        type: integer
      redact:
        description: Redact redact given list of keys from query parameter, request
          header and body.
        items:
          type: string
        type: array
      report_config:
        description: ReportConfig nuclei reporting module configuration file.
        type: string
      report_db:
        description: ReportDB nuclei reporting database.
        type: string
      required_only:
        description: RequiredOnly uses only required fields in input format when generating
          requests.
        type: boolean
      response_size_read:
        type: integer
      response_size_save:
        type: integer
      retries:
        description: Retries per request (0-10, defaults to 1)
        type: integer
      sarif_export:
        description: SarifExport file to export results in SARIF format.
        type: string
      scan_all_ips:
        description: ScanAllIPs scans all IPs associated with DNS record.
        type: boolean
      scan_strategy:
        description: |-
          Scan Strategy
          ScanStrategy: "auto", "template-spray", "host-spray"
        type: string
      secret_file:
        description: |-
          Authentication
          SecretFile path to config file containing secrets for authenticated scans.
        items:
          type: string
        type: array
      severity:
        description: Only run templates of these severities
        items:
          type: string
        type: array
      show_browser:
        type: boolean
      skip_format_validation:
        description: SkipFormatValidation skips format validation (like missing vars)
          when parsing input file.
        type: boolean
      stop_at_first_match:
        description: Stop processing HTTP requests after the first match
        type: boolean
      store_response:
        description: StoreResponse stores all request/response passed through nuclei
          to output directory.
        type: boolean
      store_response_dir:
        description: StoreResponseDir custom directory to store responses (default
          "output").
        type: string
      stream:
        type: boolean
      system_chrome:
        type: boolean
      system_resolvers:
        description: Use system DNS resolving as error fallback
        type: boolean
      tags:
        description: Only run templates with at least one of these tags
        items:
          type: string
        type: array
      template_condition:
        description: Complex expression to filter templates
        type: string
      template_ids:
        description: Restrict to these exact template IDs
        items:
          type: string
        type: array
      timeout_sec:
        description: Per-request timeout in seconds (1-300, defaults to 10)
        type: integer
      timestamp:
        description: Timestamp enables printing timestamp in CLI output.
        type: boolean
      track_error:
        items:
          type: string
        type: array
      updated_at:
        description: Last update timestamp (read-only)
        type: string
      workflow_urls:
        description: WorkflowURLs list of workflow URLs to run.
        items:
          type: string
        type: array
      workflows:
        description: |-
          Workflows
          Workflows list of workflow or workflow directory to run.
        items:
          type: string
        type: array
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.Run:
    properties:
      command_line:
        description: Full nuclei command line that was executed
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      error_message:
        description: Error message when the run failed
        type: string
      exit_code:
        description: Nuclei process exit code (null if not run)
        type: integer
      findings_critical:
        description: Critical findings
        type: integer
      findings_high:
        description: High findings
        type: integer
      findings_info:
        description: Info findings plus unknown severities
        type: integer
      findings_low:
        description: Low findings
        type: integer
      findings_medium:
        description: Medium findings
        type: integer
      finished_at:
        description: Finish time (null until terminal)
        type: string
      id:
        description: Run identifier (read-only)
        type: integer
      log_path:
        description: Path to the captured log file
        type: string
      nuclei_version:
        description: Detected nuclei engine version
        type: string
      parse_errors:
        description: Lines that failed to parse
        type: integer
      raw_output_path:
        description: Path to the raw nuclei output file
        type: string
      requests_count:
        description: Number of requests issued (not populated yet)
        type: integer
      results_total:
        description: Total findings reported
        type: integer
      stage:
        description: Stage of the run currently executing (see RunStage constants)
        type: string
      started_at:
        description: Start time (null until claimed)
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.RunStatus'
        description: Current lifecycle status (see RunStatus)
      targets_count:
        description: Number of targets in the run
        type: integer
      task_id:
        description: Identifier of the task that produced this run
        type: integer
      templates_version:
        description: Detected nuclei templates version
        type: string
      trigger:
        description: 'How the run was started: manual or schedule'
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.RunStatus:
    enum:
    - queued
    - running
    - processing
    - completed
    - failed
    - timed_out
    - stopped
    - cancelled
    type: string
    x-enum-varnames:
    - RunQueued
    - RunRunning
    - RunProcessing
    - RunCompleted
    - RunFailed
    - RunTimedOut
    - RunStopped
    - RunCancelled
  github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType:
    enum:
    - once
    - cron
    type: string
    x-enum-varnames:
    - ScheduleOnce
    - ScheduleCron
  github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry:
    properties:
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      id:
        description: Scope entry identifier (read-only)
        type: integer
      kind:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind'
        description: 'Entry type: domain, cidr or ip'
      value:
        description: Entry value, normalized on write (domain lowercased, CIDR/IP
          canonicalized)
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind:
    enum:
    - domain
    - cidr
    - ip
    type: string
    x-enum-varnames:
    - ScopeDomain
    - ScopeCIDR
    - ScopeIP
  github_com_mmk31585_Nuclei-manager_internal_domain.Severity:
    enum:
    - info
    - low
    - medium
    - high
    - critical
    type: string
    x-enum-varnames:
    - SeverityInfo
    - SeverityLow
    - SeverityMedium
    - SeverityHigh
    - SeverityCritical
  github_com_mmk31585_Nuclei-manager_internal_domain.Target:
    properties:
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      custom_ports:
        description: Custom ports when port_scope is custom (e.g. "80,443,8000-9000")
        type: string
      discovery_status:
        description: 'Discovery status: pending, running, done, failed'
        type: string
      endpoints:
        description: Discovered endpoints
        items:
          $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.TargetEndpoint'
        type: array
      exclude:
        description: Hosts, IPs or CIDRs excluded from the scan
        items:
          type: string
        type: array
      hosts:
        description: Hosts to scan (URLs, host:port, bare hosts or IPs); at least
          one required
        items:
          type: string
        type: array
      id:
        description: Target identifier (read-only, assigned by the server)
        type: integer
      last_discovery_at:
        description: Last discovery timestamp
        type: string
      last_discovery_error:
        description: Last discovery error message
        type: string
      name:
        description: Unique target name (1-191 characters)
        type: string
      port_scope:
        description: 'Port discovery scope: default, top100, top1000, all, custom'
        type: string
      probe_first:
        description: Probe hosts for reachability before scanning (defaults to true)
        type: boolean
      tags:
        description: Arbitrary labels for filtering and grouping
        items:
          type: string
        type: array
      updated_at:
        description: Last update timestamp (read-only)
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.TargetEndpoint:
    properties:
      first_seen_at:
        type: string
      host:
        type: string
      id:
        type: integer
      is_web:
        type: boolean
      last_seen_at:
        type: string
      port:
        type: integer
      scheme:
        description: http, https, or empty
        type: string
      source:
        description: naabu, httpx, manual
        type: string
      target_id:
        type: integer
      url:
        type: string
    type: object
  github_com_mmk31585_Nuclei-manager_internal_domain.Task:
    properties:
      add_to_assets:
        description: Add discovered hosts to the asset inventory
        type: boolean
      apply_suppressions:
        description: Apply configured suppressions to findings
        type: boolean
      comment:
        description: Optional free-text comment
        type: string
      created_at:
        description: Creation timestamp (read-only)
        type: string
      cron_expr:
        description: Cron expression, required when schedule_type is cron
        type: string
      enabled:
        description: Whether the schedule is enabled
        type: boolean
      id:
        description: Task identifier (read-only)
        type: integer
      last_run_at:
        description: Last scheduled run time
        type: string
      min_severity:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Severity'
        description: Minimum severity reported by this task (optional, no floor by
          default)
      name:
        description: Unique task name (1-191 characters)
        type: string
      network_protocols:
        description: Protocols to use for network port scan (e.g. "tcp,javascript")
        items:
          type: string
        type: array
      next_run_at:
        description: Next scheduled run time
        type: string
      notify_on:
        description: Severities that trigger a notification
        items:
          type: string
        type: array
      profile_id:
        description: Identifier of the profile to use (must exist)
        type: integer
      retention_keep_last:
        description: Number of most recent runs to retain (1-1000, defaults to 20)
        type: integer
      scan_network_ports:
        description: Also scan discovered non-web ports with network templates (default
          false)
        type: boolean
      schedule_type:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType'
        description: 'Schedule type: once or cron (defaults to once)'
      skip_discovery:
        description: Skip port discovery before run (default false)
        type: boolean
      target_id:
        description: Identifier of the target to scan (must exist)
        type: integer
      timezone:
        description: IANA timezone for the schedule (defaults to UTC)
        type: string
      updated_at:
        description: Last update timestamp (read-only)
        type: string
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        description: Human-readable error message
        example: 'validation failed: name is required'
        type: string
    type: object
  internal_api.LogChunk:
    properties:
      data:
        description: Decoded text chunk (invalid bytes replaced)
        type: string
      eof:
        description: True when there is no more data after this chunk
        type: boolean
      lines:
        description: Decoded text chunk split into individual lines for easier reading
        items:
          type: string
        type: array
      next_offset:
        description: Offset to pass as the next page's offset when tailing
        type: integer
      offset:
        description: Byte offset this chunk starts at
        type: integer
    type: object
