      timeout_sec:
        description: Per-request timeout in seconds (1-300)
        example: 10
        type: integer
      timestamp:
        description: Timestamp enables printing timestamp in CLI output
        type: boolean
      track_error:
        example:
        - standard
        items:
          type: string
        type: array
      workflow_urls:
        description: WorkflowURLs list of workflow URLs to run
        example:
        - https://example.com/workflow.yaml
        items:
          type: string
        type: array
      workflows:
        description: |-
          Workflows
          Workflows list of workflow or workflow directory to run
        example:
        - workflows/
        items:
          type: string
        type: array
    type: object
  internal_api.scopeRequest:
    properties:
      comment:
        description: Optional comment
        example: Corporate domain
        type: string
      kind:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeKind'
        description: 'Entry type: domain, cidr or ip'
        example: domain
      value:
        description: Entry value; normalized on write (domain lowercased, CIDR/IP
          canonicalized)
        example: example.com
        type: string
    type: object
  internal_api.targetRequest:
    properties:
      comment:
        description: Optional comment
        example: Public staging estate
        type: string
      custom_ports:
        description: Custom ports (e.g. "80,443,8000-9000"), used only when port_scope
          is custom
        example: 80,443,8000-9000
        type: string
      exclude:
        description: Hosts, IPs or CIDRs excluded from the scan
        example:
        - 10.0.0.0/8
        items:
          type: string
        type: array
      hosts:
        description: Hosts to scan (URLs, host:port, bare hosts or IPs); at least
          one required
        example:
        - https://app.example.com
        items:
          type: string
        type: array
      name:
        description: Unique target name
        example: staging-web
        type: string
      port_scope:
        description: 'Port scope for discovery: default, top100, top1000, all, custom
          (default all)'
        example: all
        type: string
      probe_first:
        description: Probe hosts before scanning; defaults to true when omitted
        type: boolean
      tags:
        description: Arbitrary labels
        example:
        - prod
        items:
          type: string
        type: array
    type: object
  internal_api.taskRequest:
    properties:
      add_to_assets:
        description: Add discovered hosts to the asset inventory
        type: boolean
      apply_suppressions:
        description: Apply configured suppressions to findings
        type: boolean
      comment:
        description: Optional comment
        example: Nightly staging scan
        type: string
      cron_expr:
        description: Cron expression, required when schedule_type is cron
        example: 0 2 * * *
        type: string
      enabled:
        description: Whether the schedule is enabled
        type: boolean
      min_severity:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Severity'
        description: Minimum severity reported (optional, no floor by default)
        example: info
      name:
        description: Unique task name
        example: nightly-staging
        type: string
      network_protocols:
        description: Protocols to use for network port scan (e.g. "tcp,javascript")
        example:
        - tcp
        - javascript
        items:
          type: string
        type: array
      notify_on:
        description: Severities that trigger a notification
        example:
        - high
        - critical
        items:
          type: string
        type: array
      profile_id:
        description: Profile to use (must exist)
        example: 1
        type: integer
      retention_keep_last:
        description: Number of most recent runs to retain (1-1000)
        example: 20
        type: integer
      scan_network_ports:
        description: Also scan discovered non-web ports with network templates (default
          false)
        type: boolean
      schedule_type:
        allOf:
        - $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScheduleType'
        description: 'Schedule type: once or cron'
        example: cron
      skip_discovery:
        description: Skip port discovery before run (default false)
        type: boolean
      target_id:
        description: Target to scan (must exist)
        example: 1
        type: integer
      timezone:
        description: IANA timezone for the schedule
        example: UTC
        type: string
    type: object
host: localhost
info:
  contact:
    name: scanner-manager
    url: https://github.com/mmk31585/Nuclei-manager
  description: |-
    REST API for managing Nuclei vulnerability scans.
    The service validates every target against a configurable scope allowlist,
    exposes scan profiles (built-in and custom), and stores tasks that bind a
    target to a profile. It is the control plane for a planned worker that
    executes Nuclei and stores runs and findings.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: scanner-manager API
  version: "0.1"
paths:
  /profiles:
    get:
      description: Returns all scan profiles ordered by id, including the seeded built-in
        profiles.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List profiles
      tags:
      - profiles
    post:
      consumes:
      - application/json
      description: Creates a custom profile. Zero-valued numeric fields are filled
        with defaults before validation.
      parameters:
      - description: Profile to create
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/internal_api.profileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a profile
      tags:
      - profiles
  /profiles/{id}:
    delete:
      description: Deletes a custom profile by id. Built-in profiles and profiles
        referenced by tasks return 409.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Built-in profile or profile in use
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Delete a profile
      tags:
      - profiles
    get:
      description: Returns a single profile by id.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a profile
      tags:
      - profiles
    put:
      consumes:
      - application/json
      description: Full replacement of a custom profile by id. Built-in profiles are
        read-only and return 409.
      parameters:
      - description: Profile ID
        in: path
        name: id
        required: true
        type: integer
      - description: Replacement profile
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/internal_api.profileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Profile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Built-in profiles are read-only
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Replace a profile
      tags:
      - profiles
  /runs:
    get:
      description: Returns runs ordered by id (newest first). Optionally filter by
        task_id and/or status.
      parameters:
      - description: Filter by task ID
        in: query
        name: task_id
        type: integer
      - description: Filter by status
        enum:
        - queued
        - running
        - processing
        - completed
        - failed
        - timed_out
        - stopped
        - cancelled
        in: query
        name: status
        type: string
      - description: Maximum results (1-200, default 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List runs
      tags:
      - runs
  /runs/{id}:
    get:
      description: Returns a single run by id, including timing and finding counters.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a run
      tags:
      - runs
  /runs/{id}/log:
    get:
      description: Returns a UTF-8 page of the run's supervisor log starting at a
        byte offset. Pass next_offset back to tail.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      - description: Byte offset to start from (default 0)
        in: query
        name: offset
        type: integer
      - description: Maximum bytes to return (default 65536, max 1048576)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.LogChunk'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Read run log
      tags:
      - runs
  /runs/{id}/output:
    get:
      description: Downloads the raw Nuclei JSONL results for a run as application/x-ndjson.
        Use ?format=pdf to get a PDF report instead. The results of the web pass and
        of the optional network pass are merged; pass "pass=web" or "pass=network"
        to download only one of them. Returns 204 if the run produced no findings.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      - description: Only return the given pass
        enum:
        - web
        - network
        in: query
        name: pass
        type: string
      - description: Output format
        enum:
        - json
        - pdf
        in: query
        name: format
        type: string
      produces:
      - application/x-ndjson
      - application/pdf
      responses:
        "200":
          description: Newline-delimited JSON results or PDF report
          schema:
            type: string
        "204":
          description: No findings produced
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: No output yet
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Download raw run output
      tags:
      - runs
  /runs/{id}/output.pdf:
    get:
      description: Generates and downloads a PDF report of the run's Nuclei findings
        (web + network passes merged). Returns 204 if the run produced no findings.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF report
          schema:
            type: string
        "204":
          description: No findings produced
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: No output yet
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Download run output as PDF
      tags:
      - runs
  /runs/{id}/stop:
    post:
      description: Cancels a queued run, or asks the worker to stop a running run.
        Stopping a running run is asynchronous.
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Run cancelled while still queued
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Run'
        "202":
          description: Stop requested for a running run
          schema:
            properties:
              status:
                type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Run already finished or is not active on this instance
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Stop a run
      tags:
      - runs
  /scope:
    get:
      description: Returns all scope allowlist entries ordered by id. An empty allowlist
        makes the target check fail-closed.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List scope entries
      tags:
      - scope
    post:
      consumes:
      - application/json
      description: Adds a domain, CIDR or IP to the allowlist. Values are normalized
        and validated.
      parameters:
      - description: Scope entry to create
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/internal_api.scopeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.ScopeEntry'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a scope entry
      tags:
      - scope
  /scope/{id}:
    delete:
      description: Removes a scope entry by id.
      parameters:
      - description: Scope entry ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Delete a scope entry
      tags:
      - scope
  /targets:
    get:
      description: Returns all targets ordered by id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Target'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List targets
      tags:
      - targets
    post:
      consumes:
      - application/json
      description: Creates a target after validating it and enforcing the scope allowlist
        on every host. Rejects out-of-scope hosts with 422.
      parameters:
      - description: Target to create
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/internal_api.targetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "422":
          description: One or more hosts are outside the allowed scope
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a target
      tags:
      - targets
  /targets/{id}:
    delete:
      description: Deletes a target by id. Returns 409 when one or more tasks reference
        it.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Target is used by one or more tasks
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      tags:
      - targets
    get:
      description: Returns a single target by id.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a target
      tags:
      - targets
    put:
      consumes:
      - application/json
      description: Full replacement of a target by id. The new host list is re-validated
        against the scope allowlist.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      - description: Replacement target
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/internal_api.targetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Target'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "422":
          description: One or more hosts are outside the allowed scope
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Replace a target
      tags:
      - targets
  /targets/{id}/discover:
    post:
      description: Triggers a new port/service discovery run in the background. Returns
        202.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Re-run discovery for a target
      tags:
      - targets
  /targets/{id}/endpoints:
    get:
      description: Returns all discovered ports/services for a target.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.TargetEndpoint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List discovered endpoints for a target
      tags:
      - targets
  /tasks:
    get:
      description: Returns all tasks ordered by id.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Task'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a task binding a target to a profile. Both must already
        exist.
      parameters:
      - description: Task to create
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_api.taskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Task'
        "400":
          description: Invalid payload or unknown target_id/profile_id
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Create a task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Deletes a task by id. Returns 409 when the task has an active (queued
        or running) run.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Task has an active run
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Returns a single task by id.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Get a task
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Full replacement of a task by id. The referenced target and profile
        must exist.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: integer
      - description: Replacement task
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_api.taskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mmk31585_Nuclei-manager_internal_domain.Task'
        "400":
          description: Invalid payload or unknown target_id/profile_id
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Replace a task
      tags:
      - tasks
  /tasks/{id}/run:
    post:
      description: Validates the task's target/profile against the scope, freezes
        a config snapshot and queues a run. The worker picks it up and executes Nuclei.
      parameters:
      - description: Task ID
