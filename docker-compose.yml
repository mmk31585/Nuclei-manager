services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: scanner
      MARIADB_USER: scanner
      MARIADB_PASSWORD: scanner
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - scanner-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SM_HTTP_ADDR: 0.0.0.0:8080
      SM_GIN_MODE: release
      SM_DB_DSN: scanner:scanner@tcp(127.0.0.1:3306)/scanner?charset=utf8mb4&parseTime=True&loc=UTC
      SM_DATA_DIR: /app/data
      SM_NUCLEI_BIN: nuclei
      SM_NUCLEI_TEMPLATES_DIR: /nuclei-templates
      SM_MAX_CONCURRENT_RUNS: 2
      SM_WORKER_POLL: 2s
    ports:
      - "127.0.0.1:8080:8080"
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./custom-templates:/app/custom-templates
      - /home/space/nuclei-templates:/nuclei-templates

  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    networks:
      - scanner-network

networks:
  scanner-network:
    driver: bridge

volumes:
  dbdata:
  appdata: